[package]
name = "cmux-cua-core"
version.workspace = true
edition.workspace = true

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
async-trait = "0.1"
# Used by the shared `image_utils` module — pure PNG/JPEG/resize/crosshair
# helpers extracted from `platform-{macos,windows,linux}/src/capture.rs` so
# all three platforms call the same code path.
image = { workspace = true }

[dev-dependencies]
tempfile = "3"

# `machine_consent` opens acpmux's consent record without following a link
# and checks its owner against this process's uid.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Used by `cursor_sampler::sample_cursor` to poll the OS mouse position
# during video recording. Same version as platform-windows uses to avoid
# a duplicate crate version.
[target.'cfg(windows)'.dependencies]
# Win32_Security*/Win32_System_Threading: `machine_consent` checks the owner
# and DACL of acpmux's consent and join records on the opened handle.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }
