name: "CI: Cold Start Benchmark"

# This workflow is privileged. Manual requests are handled by the separate
# no-secret dispatcher below; workflow_run validation binds them to protected
# main before any API key or Slack webhook is exposed.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] -- source is validated below
    workflows: ["CI: Cold Start Benchmark (request)"]
    types: [completed]

permissions: {}

concurrency:
  group: cold-start-benchmark-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  validate-source:
    name: Validate protected benchmark source
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.validate.outputs.commit }}
    steps:
      - name: Checkout trusted workflow revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Bind run to protected main
        id: validate
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_REPOSITORY: manaflow-ai/cmux-cua
          TRUSTED_SHA: ${{ github.sha }}
          TRUSTED_REF_PROTECTED: ${{ github.ref_protected }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 .github/scripts/validate_trusted_main.py

  benchmark:
    name: Run cold start benchmark
    needs: validate-source
    if: needs.validate-source.result == 'success'
    environment: cold-start-benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout protected source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.validate-source.outputs.commit }}
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          rm -rf .venv
          uv venv --python 3.12
          uv pip install -e libs/python/core -e libs/python/computer -e libs/python/cua-sandbox

      - name: Run cold start benchmark
        id: benchmark
        timeout-minutes: 10
        env:
          CUA_API_KEY: ${{ secrets.CUA_API_KEY }}
        run: uv run python tests/cold_start_benchmark.py

      - name: Send results to Slack
        if: always()
        uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58 # v2.4.0
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: ${{ vars.SLACK_CHANNEL }}
          SLACK_TITLE: "Cloud Sandbox Cold Start Benchmark"
          SLACK_COLOR: ${{ env.SLACK_COLOR }}
          SLACK_MESSAGE: |
            ${{ env.SLACK_MESSAGE }}
