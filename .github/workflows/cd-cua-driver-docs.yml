name: "CD: Cua Driver Reference Docs"

# A tag run may open the generated-docs PR. Manual runs only build and upload
# the generated files, so branch-controlled YAML never receives write tokens.
on:
  push:
    tags:
      - "cua-driver-rs-v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-tag:
    if: github.event_name == 'push' && github.ref_protected == true
    permissions:
      contents: read
    uses: ./.github/workflows/verify-release-tag.yml
    with:
      tag_prefix: cua-driver-rs-v

  verify-publish:
    if: github.event_name == 'push' && github.ref_protected == true
    permissions:
      contents: read
    uses: ./.github/workflows/verify-release-tag.yml
    with:
      tag_prefix: cua-driver-rs-v

  regenerate-reference-docs:
    name: Regenerate cua-driver reference
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.verify-tag.result == 'success')
    needs: [verify-tag]
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Install docs dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master

      - name: Build cua-driver (release)
        working-directory: libs/cua-driver/rust
        run: cargo build -p cua-driver --release

      - name: Regenerate reference docs
        run: pnpm --dir docs run docs:generate -- --library cua-driver

      - name: Upload generated reference docs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cua-driver-reference-docs
          path: docs/content/docs/reference/cua-driver/*.mdx
          if-no-files-found: error
          retention-days: 1

  open-reference-pr:
    name: Open generated-docs pull request
    if: >-
      always() && github.event_name == 'push' &&
      needs.verify-tag.result == 'success' &&
      needs.verify-publish.result == 'success' &&
      needs.regenerate-reference-docs.result == 'success'
    needs: [verify-tag, verify-publish, regenerate-reference-docs]
    runs-on: ubuntu-latest
    environment: release-app
    permissions:
      actions: read # Download the generated docs artifact.
      contents: write # Push the generated-docs branch.
      pull-requests: write # Open or update the generated-docs PR.
    steps:
      - name: Checkout the verified tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Recheck tag provenance before credentials
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
          RELEASE_TAG_PREFIX: cua-driver-rs-v
          RELEASE_BASE_BRANCH: main
          RELEASE_TRUSTED_REPOSITORY: trycua/cua
        run: python3 "${GITHUB_WORKSPACE}/.github/scripts/verify_release_tag.py"

      - name: Download generated reference docs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cua-driver-reference-docs
          path: "$RUNNER_TEMP/cua-driver-reference-docs"

      - name: Apply generated reference docs
        env:
          GENERATED_DOCS: "$RUNNER_TEMP/cua-driver-reference-docs"
        run: cp "$GENERATED_DOCS"/*.mdx docs/content/docs/reference/cua-driver/

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@0f859bf9e69e887678d5bbfbee594437cb440ffe # v2.1.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open PR with refreshed reference docs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/content/docs/reference/cua-driver; then
            echo "Reference docs already up to date; nothing to open."
            exit 0
          fi

          branch="docs/cua-driver-reference-${RELEASE_TAG}"
          git config user.name "trycua-release[bot]"
          git config user.email "trycua-release[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add docs/content/docs/reference/cua-driver
          git commit -m "docs(cua-driver): regenerate reference for ${RELEASE_TAG}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git push -u origin "$branch" --force-with-lease
          gh pr create --repo "$REPOSITORY" --base main --head "$branch" \
            --title "docs(cua-driver): regenerate reference for ${RELEASE_TAG}" \
            --body "Auto-generated from cua-driver dump-docs at ${RELEASE_TAG}."
