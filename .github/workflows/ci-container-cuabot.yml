name: "CI: Container CuaBot"

on:
  pull_request:
    paths:
      - "libs/cuabot/Dockerfile"
      - "libs/cuabot/src/**"
      - ".github/workflows/ci-container-cuabot.yml"
      - ".github/workflows/docker-reusable-build.yml"

jobs:
  build:
    uses: ./.github/workflows/docker-reusable-build.yml
    with:
      image_name: cuabot
      context_dir: libs/cuabot
      # The current xpra package available to this image is not supported on
      # arm64. Keep CI aligned with the release caller until upstream adds it.
      skip_arm64: true
