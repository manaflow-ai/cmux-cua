name: "CD: Bump Version (request)"

# The dispatch workflow may be selected from a branch.  It is therefore a
# data-only request channel: no checkout, secrets, repository writes, or
# environment-protected jobs are allowed here.  The protected consumer in
# release-bump-version.yml performs the actual bump from main.
on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service/Package to bump"
        required: true
        type: choice
        options:
          - pypi/cua
          - pypi/agent
          - pypi/auto
          - pypi/bench
          - pypi/bench-ui
          - pypi/cli
          - pypi/computer
          - pypi/computer-server
          - pypi/cloud
          - pypi/core
          - pypi/mcp-server
          - pypi/sandbox
          - pypi/sandbox-apps
          - pypi/som
          - pypi/train
          - npm/cli
          - npm/computer
          - npm/core
          - npm/playground
          - npm/cuabot
          - lume
          - cua-driver
          - cua-driver-rs
          - docker/cuabot
          - docker/kasm
          - docker/xfce
          - docker/lumier
          - docker/qemu-android
          - docker/qemu-linux
          - docker/qemu-windows
      bump_type:
        description: "Version bump type"
        required: true
        type: choice
        options: [patch, minor, major]

permissions: {}

concurrency:
  group: release-bump-request-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  request:
    name: Record release-bump request
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Validate request metadata
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
          SHA: ${{ github.sha }}
          SERVICE: ${{ inputs.service }}
          BUMP_TYPE: ${{ inputs.bump_type }}
        run: |
          set -euo pipefail
          test "$REPOSITORY" = "manaflow-ai/cmux-cua"
          test "$REF" = "refs/heads/main"
          test "$REF_PROTECTED" = "true"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$SERVICE" in
            pypi/*|npm/*|docker/*|lume|cua-driver|cua-driver-rs) ;;
            *) echo "service is not allowlisted: $SERVICE" >&2; exit 1 ;;
          esac
          case "$BUMP_TYPE" in
            patch|minor|major) ;;
            *) echo "bump type is not allowlisted: $BUMP_TYPE" >&2; exit 1 ;;
          esac
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          Path("request.json").write_text(
              json.dumps(
                  {"service": os.environ["SERVICE"], "bump_type": os.environ["BUMP_TYPE"]},
                  separators=(",", ":"),
              ),
              encoding="utf-8",
          )
          PY

      - name: Upload request artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bump-request
          path: request.json
          if-no-files-found: error
          retention-days: 1
