name: "CD: Container QEMU Android"

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] -- protected-main validator binds the exact source run
    workflows:
      - "Release tag request"
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.workflow }}-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  # Read-only provenance check. It is skipped for manual unsigned builds.
  verify-tag:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'docker-cua-qemu-android-v')
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/validate-release-request.yml
    with:
      tag_prefix: docker-cua-qemu-android-v

  # Independent check immediately gates registry credentials.
  verify-publish:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'docker-cua-qemu-android-v')
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/validate-release-request.yml
    with:
      tag_prefix: docker-cua-qemu-android-v

  manual-build:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: ./.github/workflows/docker-reusable-build.yml
    with:
      image_name: cua-qemu-android
      context_dir: libs/qemu-docker/android
      dockerfile_path: Dockerfile
      skip_arm64: true # Android QEMU image is not buildable on arm64

  publish:
    if: >-
      github.repository == 'trycua/cua' &&
      always() &&
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      needs.verify-tag.result == 'success' &&
      needs.verify-publish.result == 'success'
    needs: [verify-tag, verify-publish]
    permissions:
      actions: read # Read the build and digest artifacts.
      contents: read # Allow the reusable publisher to verify source.
    uses: ./.github/workflows/docker-reusable-publish.yml
    with:
      image_name: cua-qemu-android
      context_dir: libs/qemu-docker/android
      tag_prefix: docker-cua-qemu-android-v
      source_sha: ${{ needs.verify-tag.outputs.commit }}
      source_tag: ${{ needs.verify-tag.outputs.tag }}
      docker_hub_org: trycua
      skip_arm64: true # Android QEMU image is not buildable on arm64
