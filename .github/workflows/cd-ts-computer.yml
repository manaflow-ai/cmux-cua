name: "CD: @trycua/computer (npm)"

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] -- protected-main validator binds the exact source run
    workflows:
      - "Release tag request"
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build without publishing"
        required: false
        default: ""

permissions: {}

concurrency:
  group: release-${{ github.workflow }}-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  # Read-only provenance check. It is skipped for manual unsigned builds.
  verify-tag:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'npm-computer-v')
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/validate-release-request.yml
    with:
      tag_prefix: npm-computer-v

  # Independent check immediately gates registry credentials.
  verify-publish:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'npm-computer-v')
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/validate-release-request.yml
    with:
      tag_prefix: npm-computer-v

  prepare:
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.verify-tag.result == 'success')
    needs: verify-tag
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      tag: ${{ steps.get-version.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Release runs build the exact commit validated by the observer.
          # Manual dispatch falls back to the immutable workflow revision.
          ref: ${{ github.event_name == 'workflow_run' && needs.verify-tag.outputs.commit || github.workflow_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve release version
        id: get-version
        env:
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
          RELEASE_TAG_PREFIX: npm-computer-v
          RELEASE_SOURCE_TAG: ${{ needs.verify-tag.outputs.tag }}
          RELEASE_PACKAGE_JSON: libs/typescript/computer/package.json
        run: python3 "${GITHUB_WORKSPACE}/.github/scripts/resolve_release_version.py"
  manual-build:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: ./.github/workflows/ts-reusable-build.yml
    with:
      package_name: "computer"
      package_dir: "libs/typescript/computer"
      package_manager: "pnpm"

  publish:
    if: >-
      github.repository == 'trycua/cua' &&
      always() &&
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      needs.prepare.result == 'success' &&
      needs.verify-publish.result == 'success'
    needs: [prepare, verify-tag, verify-publish]
    permissions:
      actions: read # Read the package artifact in the reusable publisher.
      contents: read # Check out and verify the release source.
      id-token: write # Mint the npm Trusted Publishing identity.
    uses: ./.github/workflows/ts-reusable-publish.yml
    with:
      allow_legacy_token: false
      trusted_publisher_repository: "trycua/cua"
      trusted_package_name: "@trycua/computer"
      trusted_publisher_workflow: "cd-ts-computer.yml"
      trusted_tag_prefix: "npm-computer-v"
      expected_tag: ${{ needs.prepare.outputs.tag }}
      expected_version: ${{ needs.prepare.outputs.version }}
      source_sha: ${{ needs.verify-tag.outputs.commit }}
      source_tag: ${{ needs.verify-tag.outputs.tag }}
      package_name: "computer"
      package_dir: "libs/typescript/computer"
      package_manager: "pnpm"
      version: ${{ needs.prepare.outputs.version }}
  create-release:
    if: >-
      github.repository == 'trycua/cua' &&
      always() &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      needs.verify-tag.result == 'success' &&
      needs.verify-publish.result == 'success' &&
      needs.publish.result == 'success'
    needs: [prepare, verify-tag, verify-publish, publish]
    permissions:
      actions: read # Download release artifacts.
      contents: write # Create the GitHub release after publication.
    uses: ./.github/workflows/release-github-reusable.yml
    with:
      tag_prefix: npm-computer-v
      tag_name: ${{ needs.prepare.outputs.tag }}
      source_sha: ${{ needs.verify-tag.outputs.commit }}
      source_tag: ${{ needs.verify-tag.outputs.tag }}
      release_name: "@trycua/computer v${{ needs.prepare.outputs.version }}"
      module_path: "libs/typescript/computer"
      body: |
        ## Installation

        ```bash
        npm install @trycua/computer
        ```
