name: "CI: Test Scripts"

on:
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/ci-test-scripts.yml"
      - "libs/cmux-cua/scripts/**"
      - ".github/workflows/cd-rust-cmux-cua.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest toml

      - name: Run tests
        run: |
          cd .github/scripts
          pytest tests/ -v

      # The cmux-cua release scripts (version and archive gates) and their
      # workflow wiring tests. The release workflow runs them too.
      - name: Run cmux-cua release script tests
        run: python -m unittest discover -s libs/cmux-cua/scripts/tests -v
