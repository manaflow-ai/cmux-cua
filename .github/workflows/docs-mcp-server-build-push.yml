name: "CD: Docs MCP Server"

# Pull requests and manual runs build the image without credentials or shared
# cache writes. The publish consumer starts only from the credential-free main
# observer and validates its source commit from protected main.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] -- protected-main validator binds the exact source run
    workflows: ["Docs MCP Server publish request"]
    types: [completed]
  pull_request:
    branches: [main]
    paths:
      - "docs/scripts/docs-mcp-server/**"
  workflow_dispatch:

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 296062593712.dkr.ecr.us-west-2.amazonaws.com
  ECR_REPOSITORY: docs-mcp-server
  SERVICE_DIR: docs/scripts/docs-mcp-server

# A run is isolated per ref. PR runs may be cancelled; main publishes finish.
concurrency:
  group: docs-mcp-server-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  pull-request-build:
    name: Build ${{ matrix.platform }} (pull request)
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout pull request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@18ce135bb5112fa8ce4ed6c17ab05699d7f3a5e0 # v3.11.0

      - name: Build image without shared cache
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./${{ env.SERVICE_DIR }}
          file: ./${{ env.SERVICE_DIR }}/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          no-cache: true

  manual-build:
    name: Build ${{ matrix.platform }} (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout selected source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@18ce135bb5112fa8ce4ed6c17ab05699d7f3a5e0 # v3.11.0

      - name: Build image without credentials
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./${{ env.SERVICE_DIR }}
          file: ./${{ env.SERVICE_DIR }}/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          no-cache: true

  validate-provenance:
    name: Validate main publish request
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      source_sha: ${{ steps.validate.outputs.commit }}
      source_run_id: ${{ steps.validate.outputs.source_run_id }}
    steps:
      - name: Checkout the protected release validators
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository }}
          ref: main
          path: trusted-release
          fetch-depth: 1
          sparse-checkout: |
            .github/scripts/validate_main_workflow_run.py
            .github/scripts/validate_release_request.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Validate source workflow run
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          TRUSTED_REF: ${{ github.ref }}
          TRUSTED_REF_TYPE: ${{ github.ref_type }}
          TRUSTED_REF_NAME: ${{ github.ref_name }}
          TRUSTED_REF_PROTECTED: ${{ github.ref_protected }}
          TRUSTED_SHA: ${{ github.workflow_sha || github.sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_STATUS: ${{ github.event.workflow_run.status }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
          SOURCE_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 trusted-release/.github/scripts/validate_main_workflow_run.py

  publish-metadata:
    name: Prepare trusted publish metadata
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      needs.validate-provenance.result == 'success'
    needs: validate-provenance
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      timestamp: ${{ steps.timestamp.outputs.value }}
    steps:
      - name: Generate immutable tag suffix
        id: timestamp
        run: printf 'value=%s\n' "$(date -u +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"

  publish-build:
    name: Build and push ${{ matrix.platform }}
    needs: [validate-provenance, publish-metadata]
    if: >-
      github.repository == 'trycua/cua' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      needs.validate-provenance.result == 'success' &&
      needs.publish-metadata.result == 'success'
    environment: docs-release
    permissions:
      contents: read
      id-token: write # OIDC is available only after the canonical-main event guard.
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout the validated source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.validate-provenance.outputs.source_sha }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout the protected release validators
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository }}
          ref: main
          path: trusted-release
          fetch-depth: 1
          sparse-checkout: |
            .github/scripts/validate_main_workflow_run.py
            .github/scripts/validate_release_request.py
            .github/scripts/validate_publisher_repository.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Recheck source provenance before ECR credentials
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          TRUSTED_REF: ${{ github.ref }}
          TRUSTED_REF_TYPE: ${{ github.ref_type }}
          TRUSTED_REF_NAME: ${{ github.ref_name }}
          TRUSTED_REF_PROTECTED: ${{ github.ref_protected }}
          TRUSTED_SHA: ${{ github.workflow_sha || github.sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_STATUS: ${{ github.event.workflow_run.status }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
          SOURCE_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_SHA: ${{ needs.validate-provenance.outputs.source_sha }}
        run: python3 trusted-release/.github/scripts/validate_main_workflow_run.py

      - name: Require canonical publisher repository
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 trusted-release/.github/scripts/validate_publisher_repository.py

      - name: Prepare platform tag
        id: platform
        env:
          PLATFORM: ${{ matrix.platform }}
        run: printf 'tag=%s\n' "${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::296062593712:role/github-actions-ecr-push-cua
          role-session-name: docs-mcp-${{ github.run_id }}-${{ steps.platform.outputs.tag }}
          allowed-account-ids: 296062593712
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@18ce135bb5112fa8ce4ed6c17ab05699d7f3a5e0 # v3.11.0

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest
            type=raw,value=main-${{ needs.publish-metadata.outputs.timestamp }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./source/${{ env.SERVICE_DIR }}
          file: ./source/${{ env.SERVICE_DIR }}/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }},push-by-digest=true,name-canonical=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.ECR_REPOSITORY }}-${{ steps.platform.outputs.tag }}
          cache-to: type=gha,mode=max,scope=${{ env.ECR_REPOSITORY }}-${{ steps.platform.outputs.tag }}

      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM_TAG: ${{ steps.platform.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Unexpected image digest" >&2
            exit 1
          fi
          mkdir -p /tmp/digests
          printf '%s\n' "$DIGEST" > "/tmp/digests/${PLATFORM_TAG}.txt"

      - name: Upload image digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-mcp-digest-${{ steps.platform.outputs.tag }}
          path: /tmp/digests/*.txt
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    name: Publish multi-architecture manifest
    needs: [validate-provenance, publish-metadata, publish-build]
    if: >-
      github.repository == 'trycua/cua' &&
      needs.publish-build.result == 'success' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      needs.validate-provenance.result == 'success' &&
      needs.publish-metadata.result == 'success'
    environment: docs-release
    permissions:
      actions: read # Download artifacts from this trusted run.
      contents: read # Read the trusted main checkout.
      id-token: write # Assume the ECR role only for this trusted job.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the protected release validators
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository }}
          ref: main
          path: trusted-release
          fetch-depth: 1
          sparse-checkout: |
            .github/scripts/validate_main_workflow_run.py
            .github/scripts/validate_release_request.py
            .github/scripts/validate_publisher_repository.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Recheck source provenance before ECR credentials
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          TRUSTED_REF: ${{ github.ref }}
          TRUSTED_REF_TYPE: ${{ github.ref_type }}
          TRUSTED_REF_NAME: ${{ github.ref_name }}
          TRUSTED_REF_PROTECTED: ${{ github.ref_protected }}
          TRUSTED_SHA: ${{ github.workflow_sha || github.sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_STATUS: ${{ github.event.workflow_run.status }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
          SOURCE_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_SHA: ${{ needs.validate-provenance.outputs.source_sha }}
        run: python3 trusted-release/.github/scripts/validate_main_workflow_run.py

      - name: Require canonical publisher repository
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 trusted-release/.github/scripts/validate_publisher_repository.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::296062593712:role/github-actions-ecr-push-cua
          role-session-name: docs-mcp-manifest-${{ github.run_id }}
          allowed-account-ids: 296062593712
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@18ce135bb5112fa8ce4ed6c17ab05699d7f3a5e0 # v3.11.0

      - name: Extract final image metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest
            type=raw,value=main-${{ needs.publish-metadata.outputs.timestamp }}

      - name: Download platform digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: docs-mcp-digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Create and push manifest list
        env:
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
          METADATA_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          mapfile -t digest_files < <(find /tmp/digests -type f -name '*.txt' -print | sort)
          if [[ "${#digest_files[@]}" -ne 2 ]]; then
            echo "Expected two platform digests, found ${#digest_files[@]}" >&2
            exit 1
          fi

          digest_args=()
          for file in "${digest_files[@]}"; do
            digest="$(<"$file")"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Unexpected digest in $file" >&2
              exit 1
            fi
            digest_args+=("${IMAGE}@${digest}")
          done

          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            docker buildx imagetools create --tag "$tag" "${digest_args[@]}"
          done <<< "$METADATA_TAGS"

      - name: Inspect published manifests
        env:
          METADATA_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            docker buildx imagetools inspect "$tag"
          done <<< "$METADATA_TAGS"
