name: Reusable Docker Publish Workflow

on:
  workflow_call:
    inputs:
      image_name:
        description: "Docker image name"
        required: true
        type: string
      context_dir:
        description: "Directory containing the Dockerfile"
        required: true
        type: string
      dockerfile_path:
        description: "Dockerfile path relative to context_dir"
        required: false
        type: string
        default: Dockerfile
      tag_prefix:
        description: "Semantic-version tag prefix"
        required: true
        type: string
      docker_hub_org:
        description: "Docker Hub organization"
        required: false
        type: string
        default: trycua
      skip_arm64:
        description: "Do not build an arm64 image"
        required: false
        type: boolean
        default: false
permissions: {}

jobs:
  # Reusable callers can change over time. Verify again inside this credentialed
  # workflow so a future caller cannot publish an arbitrary branch or tag.
  verify-tag:
    if: >-
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      github.ref_protected == true
    permissions:
      contents: read
    uses: ./.github/workflows/verify-release-tag.yml
    with:
      tag_prefix: ${{ inputs.tag_prefix }}

  build-and-push:
    name: Build and publish ${{ matrix.platform }}
    needs: verify-tag
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      github.ref_protected == true &&
      needs.verify-tag.result == 'success'
    permissions:
      actions: read # Read registry cache metadata.
      contents: read # Check out the verified source commit.
    environment: docker-release
    timeout-minutes: 120
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.skip_arm64 && '["linux/amd64"]' || '["linux/amd64", "linux/arm64"]') }}
    steps:
      - name: Check out the verified tag commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Recheck release tag provenance
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
          RELEASE_BASE_BRANCH: main
          RELEASE_TAG_PREFIX: ${{ inputs.tag_prefix }}
          RELEASE_TRUSTED_REPOSITORY: trycua/cua
        run: python3 "${GITHUB_WORKSPACE}/.github/scripts/verify_release_tag.py"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker system prune --all --force
          df -h /

      - name: Set platform artifact name
        id: platform
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "name=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Require the protected Docker Hub credential
        env:
          DOCKER_HUB_RELEASE_TOKEN: ${{ secrets.DOCKER_HUB_RELEASE_TOKEN }}
        run: |
          if [[ -z "$DOCKER_HUB_RELEASE_TOKEN" ]]; then
            echo "docker-release environment is missing DOCKER_HUB_RELEASE_TOKEN" >&2
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ inputs.docker_hub_org }}
          password: ${{ secrets.DOCKER_HUB_RELEASE_TOKEN }}

      - name: Build and push image digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./${{ inputs.context_dir }}
          file: ./${{ inputs.context_dir }}/${{ inputs.dockerfile_path }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ inputs.docker_hub_org }}/${{ inputs.image_name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ inputs.docker_hub_org }}/${{ inputs.image_name }}:buildcache-${{ steps.platform.outputs.name }}
          cache-to: type=registry,ref=${{ inputs.docker_hub_org }}/${{ inputs.image_name }}:buildcache-${{ steps.platform.outputs.name }},mode=max

      - name: Record image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
          PLATFORM_NAME: ${{ steps.platform.outputs.name }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Build returned an invalid image digest" >&2
            exit 1
          fi
          mkdir -p /tmp/digests
          printf '%s\n' "$DIGEST" > "/tmp/digests/${PLATFORM_NAME}-${SOURCE_SHA}.txt"

      - name: Upload platform digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ steps.platform.outputs.name }}
          path: /tmp/digests/*.txt
          if-no-files-found: error
          retention-days: 1

  publish-manifest-list:
    name: Publish multi-platform manifest
    needs: [verify-tag, build-and-push]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      github.ref_protected == true &&
      needs.verify-tag.result == 'success' &&
      needs.build-and-push.result == 'success'
    permissions:
      actions: read # Download platform digest artifacts.
      contents: read # Check out the verifier script.
    environment: docker-release
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Check out the provenance verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: .github/scripts/verify_release_tag.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Recheck release tag provenance
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
          RELEASE_BASE_BRANCH: main
          RELEASE_TAG_PREFIX: ${{ inputs.tag_prefix }}
          RELEASE_TRUSTED_REPOSITORY: trycua/cua
        run: python3 "${GITHUB_WORKSPACE}/.github/scripts/verify_release_tag.py"

      - name: Download platform digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Validate platform digests
        env:
          SKIP_ARM64: ${{ inputs.skip_arm64 }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          expected=("linux-amd64-${SOURCE_SHA}.txt")
          if [[ "$SKIP_ARM64" != "true" ]]; then
            expected+=("linux-arm64-${SOURCE_SHA}.txt")
          fi

          mapfile -t actual < <(find /tmp/digests -maxdepth 1 -type f -name '*.txt' -printf '%f\n' | sort)
          if [[ "${#actual[@]}" -ne "${#expected[@]}" ]]; then
            echo "Expected ${#expected[@]} digest files, found ${#actual[@]}" >&2
            exit 1
          fi

          for file in "${expected[@]}"; do
            if [[ ! -f "/tmp/digests/$file" ]]; then
              echo "Missing digest artifact: $file" >&2
              exit 1
            fi
            digest=$(<"/tmp/digests/$file")
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Invalid digest in $file" >&2
              exit 1
            fi
          done

          if find /tmp/digests -maxdepth 1 -type l -print -quit | grep -q .; then
            echo "Digest artifacts must not contain symlinks" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Require the protected Docker Hub credential
        env:
          DOCKER_HUB_RELEASE_TOKEN: ${{ secrets.DOCKER_HUB_RELEASE_TOKEN }}
        run: |
          if [[ -z "$DOCKER_HUB_RELEASE_TOKEN" ]]; then
            echo "docker-release environment is missing DOCKER_HUB_RELEASE_TOKEN" >&2
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ inputs.docker_hub_org }}
          password: ${{ secrets.DOCKER_HUB_RELEASE_TOKEN }}

      - name: Create and inspect multi-platform manifests
        env:
          IMAGE: ${{ inputs.docker_hub_org }}/${{ inputs.image_name }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          IFS=. read -r major minor patch <<< "$VERSION"
          if [[ -z "$major" || -z "$minor" || -z "$patch" ]]; then
            echo "Verifier returned an invalid semantic version" >&2
            exit 1
          fi

          mapfile -t digest_files < <(find /tmp/digests -maxdepth 1 -type f -name "*-${SOURCE_SHA}.txt" | sort)
          digest_args=()
          for file in "${digest_files[@]}"; do
            digest=$(<"$file")
            digest_args+=("${IMAGE}@${digest}")
          done

          tags=("$VERSION" "$major.$minor" "$major" latest)
          for tag in "${tags[@]}"; do
            full_tag="${IMAGE}:${tag}"
            docker buildx imagetools create --tag "$full_tag" "${digest_args[@]}"
            docker buildx imagetools inspect "$full_tag"
          done
