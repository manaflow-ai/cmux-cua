name: Claude Auto Fix Request

# A pull-request label is untrusted input, so it must not start a privileged
# workflow. Run this diagnostic flow explicitly from the default branch.
# It deliberately does not check out pull-request code or run an agent.
# Applying an AI-generated patch remains a reviewed, local maintainer action.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to inspect
        required: true
        type: number

permissions:
  actions: read # Read failed workflow metadata; no write or cloud permissions.
  contents: read # Read repository metadata only.

concurrency:
  group: claude-auto-fix-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  inspect:
    name: Inspect failed checks (read-only)
    if: >-
      github.repository == 'manaflow-ai/cmux-cua' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    # This is a maintainer-dispatched job. It only comments diagnostic links;
    # it never executes pull-request code or receives cloud credentials.
    permissions:
      actions: read # Read failed workflow metadata for the selected pull request.
      contents: read # Read repository metadata only.
      pull-requests: write # Post diagnostic links to the selected pull request.
    runs-on: ubuntu-24.04
    steps:
      - name: Find the pull request and failed checks
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = Number(process.env.PR_NUMBER);
            if (!Number.isSafeInteger(number) || number < 1) {
              core.setFailed('pr_number must be a positive integer');
              return;
            }

            const { data: pullRequest } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: number
            });
            if (pullRequest.base.ref !== 'main' || pullRequest.base.repo.full_name !== `${owner}/${repo}`) {
              core.setFailed('The pull request must target the canonical main branch');
              return;
            }

            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner,
              repo,
              branch: pullRequest.head.ref,
              status: 'failure',
              per_page: 100
            });
            const failedRuns = runs
              .filter((run) => run.pull_requests?.some((candidate) => candidate.number === number))
              .sort((left, right) => Date.parse(right.created_at) - Date.parse(left.created_at))
              .slice(0, 10);

            const lines = [
              '## Claude Auto-Fix Diagnostics',
              '',
              `Pull request: [#${number}](https://github.com/${owner}/${repo}/pull/${number})`,
              `Head: \`${pullRequest.head.sha}\``,
              '',
              failedRuns.length === 0
                ? 'No failed workflow runs were found for this pull request.'
                : 'Recent failed workflow runs:'
            ];
            for (const run of failedRuns) {
              lines.push(`- [${run.name || 'workflow'} #${run.run_number}](${run.html_url})`);
            }
            lines.push('', 'No pull-request code was checked out or executed. Review any fix locally before committing it.');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: number,
              body: lines.join('\n')
            });
            core.notice(`Reported ${failedRuns.length} failed workflow run(s)`);
