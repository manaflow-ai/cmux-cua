name: "CD: Auto Release on Merge"

on:
  pull_request:
    types: [closed]

# The planning job only reads the merged pull request. The dispatch job gets a
# short-lived, repository-scoped App token only after a release is required.
permissions:
  contents: read # Read the trusted workflow checkout metadata.
  pull-requests: read # Read merged labels and changed paths during planning.

concurrency:
  group: release-on-merge-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    name: Determine release targets
    if: >-
      github.repository == 'trycua/cua' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.base.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
      services: ${{ steps.plan.outputs.services }}
      bump_type: ${{ steps.plan.outputs.bump_type }}
    steps:
      - name: Determine affected release targets
        id: plan
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pullRequest = context.payload.pull_request;
            const labels = new Set(pullRequest.labels.map((label) => label.name));

            const pathToService = new Map([
              ['libs/python/cua-cli/', 'pypi/cli'],
              ['libs/python/cua-auto/', 'pypi/auto'],
              ['libs/python/agent/', 'pypi/agent'],
              ['libs/python/cua-sandbox/', 'pypi/sandbox'],
              ['libs/python/computer/', 'pypi/computer'],
              ['libs/python/cua-cloud/', 'pypi/cloud'],
              ['libs/python/core/', 'pypi/core'],
              ['libs/python/som/', 'pypi/som'],
              ['libs/python/bench-ui/', 'pypi/bench-ui'],
              ['libs/cua-bench/', 'pypi/bench'],
              ['libs/python/computer-server/', 'pypi/computer-server'],
              ['libs/python/mcp-server/', 'pypi/mcp-server'],
              ['libs/typescript/cua-cli/', 'npm/cli'],
              ['libs/typescript/computer/', 'npm/computer'],
              ['libs/typescript/core/', 'npm/core'],
              ['libs/typescript/playground/', 'npm/playground'],
              ['libs/cuabot/', 'npm/cuabot'],
              ['libs/xfce/', 'docker/xfce'],
              ['libs/kasm/', 'docker/kasm'],
              ['libs/lumier/', 'docker/lumier'],
              ['libs/qemu-docker/android/', 'docker/qemu-android'],
              ['libs/qemu-docker/linux/', 'docker/qemu-linux'],
              ['libs/qemu-docker/windows/', 'docker/qemu-windows'],
              ['libs/lume/', 'lume'],
              ['libs/cua-driver/rust/', 'cua-driver-rs']
            ]);

            const changedFiles = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pullRequest.number,
              per_page: 100
            });
            const affected = new Set();
            for (const file of changedFiles) {
              for (const [prefix, service] of pathToService) {
                if (file.filename.startsWith(prefix)) {
                  affected.add(service);
                }
              }
            }

            let bumpType = 'patch';
            if (labels.has('bump:major')) {
              bumpType = 'major';
            } else if (labels.has('bump:minor')) {
              bumpType = 'minor';
            }

            const services = [...affected]
              .filter((service) => labels.has(`release:${service}`))
              .sort();
            const shouldRelease = !labels.has('no-release') && services.length > 0;

            core.setOutput('should_release', shouldRelease ? 'true' : 'false');
            core.setOutput('services', JSON.stringify(services));
            core.setOutput('bump_type', bumpType);
            core.info(`Affected services: ${JSON.stringify([...affected].sort())}`);
            core.info(`Release services: ${JSON.stringify(services)}`);

  validate-publisher-repository:
    name: Verify canonical release repository
    needs: plan
    if: needs.plan.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout the protected release gate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository }}
          ref: main
          path: trusted-release
          fetch-depth: 1
          sparse-checkout: .github/scripts/validate_publisher_repository.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Require canonical publisher repository
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 trusted-release/.github/scripts/validate_publisher_repository.py

  dispatch:
    name: Dispatch approved release workflows
    needs: [plan, validate-publisher-repository]
    if: >-
      github.repository == 'trycua/cua' &&
      needs.plan.outputs.should_release == 'true' &&
      needs.validate-publisher-repository.result == 'success'
    runs-on: ubuntu-24.04
    environment: release-control
    permissions: {}
    steps:
      - name: Require canonical publisher repository
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "trycua/cua" ]]; then
            echo "::error::Release dispatch is disabled outside trycua/cua." >&2
            exit 1
          fi

      - name: Generate scoped release token
        id: app-token
        uses: actions/create-github-app-token@0f859bf9e69e887678d5bbfbee594437cb440ffe # v2.1.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-contents: write

      - name: Dispatch one workflow per package
        timeout-minutes: 120
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          SERVICES_JSON: ${{ needs.plan.outputs.services }}
          BUMP_TYPE: ${{ needs.plan.outputs.bump_type }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            let services;
            try {
              services = JSON.parse(process.env.SERVICES_JSON);
            } catch {
              core.setFailed('Release service output is not valid JSON');
              return;
            }
            if (!Array.isArray(services) || services.some((service) => typeof service !== 'string')) {
              core.setFailed('Release service output has an invalid shape');
              return;
            }
            if (!['patch', 'minor', 'major'].includes(process.env.BUMP_TYPE)) {
              core.setFailed('Release bump type is invalid');
              return;
            }

            const workflowId = 'release-bump-version.yml';
            const wait = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
            const runTimeoutMs = 30 * 60 * 1000;

            async function listRuns(headSha) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflowId,
                event: 'repository_dispatch',
                branch: 'main',
                head_sha: headSha,
                per_page: 100
              });
              return data.workflow_runs;
            }

            async function waitForRun(headSha, knownRunIds, startedAt) {
              const deadline = Date.now() + runTimeoutMs;
              let delayMs = 2000;
              while (Date.now() < deadline) {
                const run = (await listRuns(headSha))
                  .filter((candidate) => !knownRunIds.has(candidate.id))
                  // The API timestamp has second precision. Keep a small
                  // overlap so a dispatch near a second boundary is not lost.
                  .filter((candidate) => Date.parse(candidate.created_at) >= startedAt - 60_000)
                  .sort((left, right) => Date.parse(left.created_at) - Date.parse(right.created_at))[0];
                if (run) {
                  return run;
                }
                core.info(`Waiting for ${workflowId} to appear (next poll in ${delayMs / 1000}s)`);
                await wait(delayMs);
                delayMs = Math.min(delayMs * 2, 30_000);
              }
              throw new Error(`Timed out waiting for ${workflowId} to start`);
            }

            async function waitForCompletion(run) {
              const deadline = Date.now() + runTimeoutMs;
              let delayMs = 5000;
              while (Date.now() < deadline) {
                const { data: current } = await github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });
                if (current.status === 'completed') {
                  if (current.conclusion !== 'success') {
                    throw new Error(`Release workflow ${run.id} ended with ${current.conclusion}`);
                  }
                  return;
                }
                core.info(`Release workflow ${run.id} is ${current.status} (next poll in ${delayMs / 1000}s)`);
                await wait(delayMs);
                delayMs = Math.min(delayMs * 2, 30_000);
              }
              throw new Error(`Timed out waiting for release workflow ${run.id} to complete`);
            }

            async function waitForMainAdvance(previousSha) {
              const deadline = Date.now() + runTimeoutMs;
              let delayMs = 2000;
              while (Date.now() < deadline) {
                const { data: branch } = await github.rest.repos.getBranch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  branch: 'main'
                });
                if (branch.commit.sha !== previousSha) {
                  return branch.commit.sha;
                }
                core.info(`main is still ${previousSha} (next poll in ${delayMs / 1000}s)`);
                await wait(delayMs);
                delayMs = Math.min(delayMs * 2, 30_000);
              }
              throw new Error(`Release workflow completed without advancing main from ${previousSha}`);
            }

            for (const service of services) {
              const { data: branch } = await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: 'main'
              });
              const previousSha = branch.commit.sha;
              const knownRuns = new Set(await listRuns(previousSha).then((runs) => runs.map((run) => run.id)));
              const startedAt = Date.now();

              core.info(`Dispatching ${service} (${process.env.BUMP_TYPE}) from main ${previousSha}`);
              await github.rest.repos.createDispatchEvent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                event_type: 'release-bump',
                client_payload: {
                  service,
                  bump_type: process.env.BUMP_TYPE
                }
              });

              const run = await waitForRun(previousSha, knownRuns, startedAt);
              core.info(`Release workflow for ${service} started as run ${run.id}`);
              await waitForCompletion(run);
              const nextSha = await waitForMainAdvance(previousSha);
              core.info(`Completed ${service}; main advanced to ${nextSha}`);
            }
