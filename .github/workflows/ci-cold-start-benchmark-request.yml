name: "CI: Cold Start Benchmark (request)"

# No checkout, secrets, or write permission is allowed in this dispatcher.
# The workflow_run consumer validates this run against the current protected
# main commit before it starts a benchmark.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: cold-start-benchmark-request-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  request:
    name: Record cold-start benchmark request
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: Check request metadata
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" == "manaflow-ai/cmux-cua" ]] || {
            echo "Requests are accepted only in manaflow-ai/cmux-cua" >&2
            exit 1
          }
          [[ "$REF" == "refs/heads/main" ]] || {
            echo "Select the protected main branch before requesting the benchmark" >&2
            exit 1
          }
          [[ "$REF_PROTECTED" == "true" ]] || {
            echo "The selected main branch is not protected" >&2
            exit 1
          }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "The request SHA is not a full commit SHA" >&2
            exit 1
          }
