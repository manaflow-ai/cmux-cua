name: "CD: cua-cli (PyPI)"

on:
  push:
    tags:
      - "cli-v*"
  workflow_call:
    inputs:
      version:
        description: "Version to publish"
        required: true
        type: string

permissions: {}

jobs:
  prepare:
    permissions:
      contents: read
    runs-on: macos-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Determine version
        id: get-version
        run: |
          # Check inputs.version first (set by workflow_call)
          if [ -n "${{ inputs.version }}" ]; then
            VERSION=${{ inputs.version }}
          elif [ "${{ github.event_name }}" == "push" ]; then
            # Extract version from tag (for package-specific tags)
            if [[ "${{ github.ref }}" =~ ^refs/tags/cli-v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
              VERSION=${BASH_REMATCH[1]}
            else
              echo "Invalid tag format for cli"
              exit 1
            fi
          else
            echo "No version provided"
            exit 1
          fi
          echo "VERSION=$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build-package:
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/py-reusable-build.yml
    with:
      package_name: "cli"
      package_dir: "libs/python/cua-cli"
      version: ${{ needs.prepare.outputs.version }}

  publish:
    needs: [prepare, build-package]
    permissions:
      contents: read
      actions: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pypi-cli
          path: dist

      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
  create-release:
    needs: [prepare, publish]
    permissions:
      contents: write
    uses: ./.github/workflows/release-github-reusable.yml
    with:
      tag_name: "cli-v${{ needs.prepare.outputs.version }}"
      release_name: "cua-cli v${{ needs.prepare.outputs.version }}"
      module_path: "libs/python/cua-cli"
      body: ""
