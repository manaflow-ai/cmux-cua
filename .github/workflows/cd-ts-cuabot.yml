name: "CD: cuabot (npm)"

on:
  push:
    tags:
      - "cuabot-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build without publishing"
        required: false
        default: ""

permissions: {}

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Read-only provenance check. It is skipped for manual unsigned builds.
  verify-tag:
    if: github.event_name == 'push' && github.ref_protected == true
    permissions:
      contents: read
    uses: ./.github/workflows/verify-release-tag.yml
    with:
      tag_prefix: cuabot-v

  # Independent check immediately gates registry credentials.
  verify-publish:
    if: github.event_name == 'push' && github.ref_protected == true
    permissions:
      contents: read
    uses: ./.github/workflows/verify-release-tag.yml
    with:
      tag_prefix: cuabot-v

  prepare:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      tag: ${{ steps.get-version.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve release version
        id: get-version
        env:
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
          RELEASE_TAG_PREFIX: cuabot-v
          RELEASE_PACKAGE_JSON: libs/cuabot/package.json
        run: python3 "${GITHUB_WORKSPACE}/.github/scripts/resolve_release_version.py"
  manual-build:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: ./.github/workflows/ts-reusable-build.yml
    with:
      package_name: "cuabot"
      package_dir: "libs/cuabot"
      package_manager: "pnpm"

  publish-npm:
    if: >-
      always() &&
      github.event_name == 'push' && github.ref_type == 'tag' && github.ref_protected == true &&
      needs.prepare.result == 'success' &&
      needs.verify-publish.result == 'success'
    needs: [prepare, verify-publish]
    permissions:
      actions: read # Read the package artifact in the reusable publisher.
      contents: read # Check out and verify the release source.
      id-token: write # Mint the npm Trusted Publishing identity.
    uses: ./.github/workflows/ts-reusable-publish.yml
    with:
      allow_legacy_token: false
      trusted_publisher_repository: "trycua/cua"
      trusted_package_name: "cuabot"
      trusted_publisher_workflow: "cd-ts-cuabot.yml"
      trusted_tag_prefix: "cuabot-v"
      expected_tag: ${{ needs.prepare.outputs.tag }}
      expected_version: ${{ needs.prepare.outputs.version }}
      package_name: "cuabot"
      package_dir: "libs/cuabot"
      package_manager: "pnpm"
      version: ${{ needs.prepare.outputs.version }}
  create-release:
    if: >-
      always() &&
      github.event_name == 'push' && github.ref_type == 'tag' &&
      github.ref_protected == true &&
      needs.verify-tag.result == 'success' &&
      needs.verify-publish.result == 'success' &&
      needs.publish-npm.result == 'success'
    needs: [prepare, verify-tag, verify-publish, publish-npm]
    permissions:
      actions: read # Download release artifacts.
      contents: write # Create the GitHub release after publication.
    uses: ./.github/workflows/release-github-reusable.yml
    with:
      tag_prefix: cuabot-v
      tag_name: ${{ needs.prepare.outputs.tag }}
      release_name: "cuabot v${{ needs.prepare.outputs.version }}"
      module_path: "libs/cuabot"
      body: |
        ## Quick Start

        ```bash
        npx cuabot
        ```

        Or install globally:

        ```bash
        npm install -g cuabot
        cuabot
        ```

        ## Usage

        ```bash
        cuabot                     # Run default agent (or setup)
        cuabot claude              # Run Claude Code in sandbox
        cuabot gemini              # Run Gemini CLI in sandbox
        cuabot codex               # Run Codex CLI in sandbox
        cuabot chromium            # Open sandboxed Chromium

        cuabot --screenshot        # Take screenshot
        cuabot --type "hello"      # Type text
        cuabot --click 100 200     # Click at coordinates
        ```

        ## Documentation

        - [Getting Started](https://cua.ai/docs/cuabot/cuabot)
        - [Installation Guide](https://cua.ai/docs/cuabot/install)
