name: Reusable Docker Build Workflow

on:
  workflow_call:
    inputs:
      image_name:
        description: "Docker image name"
        required: true
        type: string
      context_dir:
        description: "Directory containing the Dockerfile"
        required: true
        type: string
      dockerfile_path:
        description: "Dockerfile path relative to context_dir"
        required: false
        type: string
        default: Dockerfile
      skip_arm64:
        description: "Do not build an arm64 image"
        required: false
        type: boolean
        default: false
      source_sha:
        description: "Optional exact source commit from a protected workflow_run consumer"
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  select-platforms:
    name: Select build platforms
    permissions: {}
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.platforms.outputs.value }}
    steps:
      - name: Select target platforms
        id: platforms
        env:
          SKIP_ARM64: ${{ inputs.skip_arm64 }}
        run: |
          if [[ "$SKIP_ARM64" == "true" ]]; then
            echo 'value=["linux/amd64"]' >> "$GITHUB_OUTPUT"
          else
            echo 'value=["linux/amd64", "linux/arm64"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: select-platforms
    permissions:
      contents: read
    timeout-minutes: 120
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.select-platforms.outputs.platforms) }}
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker image without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./${{ inputs.context_dir }}
          file: ./${{ inputs.context_dir }}/${{ inputs.dockerfile_path }}
          push: false
          platforms: ${{ matrix.platform }}

      - name: Confirm successful build
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          PLATFORM: ${{ matrix.platform }}
        run: echo "Built ${IMAGE_NAME} for ${PLATFORM} without publishing"
