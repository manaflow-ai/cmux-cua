name: "CD: @trycua/playground (npm)"

on:
  push:
    tags:
      - "npm-playground-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build without publishing"
        required: false
        default: ""

permissions: {}

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Read-only provenance check. It is skipped for manual unsigned builds.
  verify-tag:
    if: github.event_name == 'push' && github.ref_protected == true
    permissions:
      contents: read
    uses: ./.github/workflows/verify-release-tag.yml
    with:
      tag_prefix: npm-playground-v

  # Independent check immediately gates registry credentials.
  verify-publish:
    if: github.event_name == 'push' && github.ref_protected == true
    permissions:
      contents: read
    uses: ./.github/workflows/verify-release-tag.yml
    with:
      tag_prefix: npm-playground-v

  prepare:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      tag: ${{ steps.get-version.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve release version
        id: get-version
        env:
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
          RELEASE_TAG_PREFIX: npm-playground-v
          RELEASE_PACKAGE_JSON: libs/typescript/playground/package.json
        run: python3 "${GITHUB_WORKSPACE}/.github/scripts/resolve_release_version.py"
  manual-build:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: ./.github/workflows/ts-reusable-build.yml
    with:
      package_name: "playground"
      package_dir: "libs/typescript/playground"
      package_manager: "pnpm"

  publish:
    if: >-
      always() &&
      github.event_name == 'push' && github.ref_type == 'tag' && github.ref_protected == true &&
      needs.prepare.result == 'success' &&
      needs.verify-publish.result == 'success'
    needs: [prepare, verify-publish]
    permissions:
      actions: read # Read the package artifact in the reusable publisher.
      contents: read # Check out and verify the release source.
      id-token: write # Mint the npm Trusted Publishing identity.
    uses: ./.github/workflows/ts-reusable-publish.yml
    with:
      allow_legacy_token: false
      trusted_publisher_repository: "trycua/cua"
      trusted_package_name: "@trycua/playground"
      trusted_publisher_workflow: "cd-ts-playground.yml"
      package_name: "playground"
      package_dir: "libs/typescript/playground"
      package_manager: "pnpm"
      version: ${{ needs.prepare.outputs.version }}
  create-release:
    if: >-
      always() &&
      github.event_name == 'push' && github.ref_type == 'tag' &&
      github.ref_protected == true &&
      needs.verify-tag.result == 'success' &&
      needs.verify-publish.result == 'success' &&
      needs.publish.result == 'success'
    needs: [prepare, verify-tag, verify-publish, publish]
    permissions:
      actions: read # Download release artifacts.
      contents: write # Create the GitHub release after publication.
    uses: ./.github/workflows/release-github-reusable.yml
    with:
      tag_prefix: npm-playground-v
      tag_name: ${{ needs.prepare.outputs.tag }}
      release_name: "@trycua/playground v${{ needs.prepare.outputs.version }}"
      module_path: "libs/typescript/playground"
      body: |
        ## Installation

        ```bash
        npm install @trycua/playground
        ```
