name: "CD: Bump Version"

# The workflow_run consumer is read from the default branch.  Its dispatch
# counterpart is deliberately data-only, so a selected feature branch cannot
# alter a job that receives the release App credentials.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] -- source is validated below
    workflows: ["CD: Bump Version (request)"]
    types: [completed]

permissions: {}

concurrency:
  group: release-bump-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  validate-request:
    name: Validate release-bump request
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # Read and bind the request workflow run and artifact.
    outputs:
      service: ${{ steps.validate.outputs.service }}
      bump_type: ${{ steps.validate.outputs.bump_type }}
      commit: ${{ steps.validate.outputs.commit }}
      source_run_id: ${{ steps.validate.outputs.source_run_id }}
    steps:
      - name: Checkout protected main for validation
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download request artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bump-request
          path: request
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate source run and request
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_FILE: request/request.json
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_REPOSITORY: manaflow-ai/cmux-cua
          TRUSTED_SHA: ${{ github.sha }}
          TRUSTED_REF_PROTECTED: ${{ github.ref_protected }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          SOURCE_WORKFLOW_NAME: "CD: Bump Version (request)"
          SOURCE_WORKFLOW_PATH: .github/workflows/release-bump-request.yml
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_STATUS: ${{ github.event.workflow_run.status }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
          SOURCE_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 .github/scripts/validate_release_bump_request.py

  bump-version:
    name: Apply release bump on main
    needs: validate-request
    if: needs.validate-request.result == 'success'
    environment: release-bump
    permissions:
      contents: read
      actions: read # Keep the request-run lookup available to the release job.
    env:
      SERVICE: ${{ needs.validate-request.outputs.service }}
      BUMP_TYPE: ${{ needs.validate-request.outputs.bump_type }}
      TARGET_BRANCH: main
      REPOSITORY: manaflow-ai/cmux-cua
    runs-on: ubuntu-latest
    steps:
      - name: Set package directory and type
        id: package
        run: |
          case "$SERVICE" in
            "pypi/cua")
              echo "directory=libs/python/cua" >> "$GITHUB_OUTPUT"
              echo "type=python" >> "$GITHUB_OUTPUT"
              ;;
            "pypi/agent")
              echo "directory=libs/python/agent" >> "$GITHUB_OUTPUT"
              echo "type=python" >> "$GITHUB_OUTPUT"
              ;;
            "pypi/auto")
              echo "directory=libs/python/cua-auto" >> "$GITHUB_OUTPUT"
              echo "type=python" >> "$GITHUB_OUTPUT"
              ;;
            "pypi/bench")
              echo "directory=libs/cua-bench" >> "$GITHUB_OUTPUT"
              echo "type=python" >> "$GITHUB_OUTPUT"
              ;;
            "pypi/bench-ui")
              echo "directory=libs/python/bench-ui" >> "$GITHUB_OUTPUT"
              echo "type=python" >> "$GITHUB_OUTPUT"
              ;;
            "pypi/cli")
              echo "directory=libs/python/cua-cli" >> "$GITHUB_OUTPUT"
              echo "type=python" >> "$GITHUB_OUTPUT"
              ;;
            "pypi/computer")
              echo "directory=libs/python/computer" >> "$GITHUB_OUTPUT"
              echo "type=python" >> "$GITHUB_OUTPUT"
              ;;
            "pypi/cloud")
              echo "directory=libs/python/cua-cloud" >> "$GITHUB_OUTPUT"
              echo "type=python" >> "$GITHUB_OUTPUT"
              ;;
            "pypi/computer-server")
              echo "directory=libs/python/computer-server" >> "$GITHUB_OUTPUT"
              echo "type=python" >> "$GITHUB_OUTPUT"
              ;;
            "pypi/core")
              echo "directory=libs/python/core" >> "$GITHUB_OUTPUT"
              echo "type=python" >> "$GITHUB_OUTPUT"
              ;;
            "pypi/mcp-server")
              echo "directory=libs/python/mcp-server" >> "$GITHUB_OUTPUT"
              echo "type=python" >> "$GITHUB_OUTPUT"
              ;;
            "pypi/sandbox")
              echo "directory=libs/python/cua-sandbox" >> "$GITHUB_OUTPUT"
              echo "type=python" >> "$GITHUB_OUTPUT"
              ;;
            "pypi/sandbox-apps")
              echo "directory=libs/python/cua-sandbox-apps" >> "$GITHUB_OUTPUT"
              echo "type=python" >> "$GITHUB_OUTPUT"
              ;;
            "pypi/som")
              echo "directory=libs/python/som" >> "$GITHUB_OUTPUT"
              echo "type=python" >> "$GITHUB_OUTPUT"
              ;;
            "pypi/train")
              echo "directory=libs/python/cua-train" >> "$GITHUB_OUTPUT"
              echo "type=python" >> "$GITHUB_OUTPUT"
              ;;
            "npm/cli")
              echo "directory=libs/typescript/cua-cli" >> "$GITHUB_OUTPUT"
              echo "type=npm" >> "$GITHUB_OUTPUT"
              ;;
            "npm/computer")
              echo "directory=libs/typescript/computer" >> "$GITHUB_OUTPUT"
              echo "type=npm" >> "$GITHUB_OUTPUT"
              ;;
            "npm/core")
              echo "directory=libs/typescript/core" >> "$GITHUB_OUTPUT"
              echo "type=npm" >> "$GITHUB_OUTPUT"
              ;;
            "npm/playground")
              echo "directory=libs/typescript/playground" >> "$GITHUB_OUTPUT"
              echo "type=npm" >> "$GITHUB_OUTPUT"
              ;;
            "npm/cuabot")
              echo "directory=libs/cuabot" >> "$GITHUB_OUTPUT"
              echo "type=npm" >> "$GITHUB_OUTPUT"
              ;;
            "lume")
              echo "directory=libs/lume" >> "$GITHUB_OUTPUT"
              echo "type=lume" >> "$GITHUB_OUTPUT"
              ;;
            "cua-driver")
              echo "directory=libs/cua-driver" >> "$GITHUB_OUTPUT"
              echo "type=cua-driver" >> "$GITHUB_OUTPUT"
              ;;
            "cua-driver-rs")
              echo "directory=libs/cua-driver/rust" >> "$GITHUB_OUTPUT"
              echo "type=cua-driver-rs" >> "$GITHUB_OUTPUT"
              ;;
            "docker/cuabot")
              echo "directory=libs/cuabot" >> "$GITHUB_OUTPUT"
              echo "type=docker" >> "$GITHUB_OUTPUT"
              echo "bumpversion_config=.bumpversion.docker.cfg" >> "$GITHUB_OUTPUT"
              ;;
            "docker/kasm")
              echo "directory=libs/kasm" >> "$GITHUB_OUTPUT"
              echo "type=docker" >> "$GITHUB_OUTPUT"
              ;;
            "docker/xfce")
              echo "directory=libs/xfce" >> "$GITHUB_OUTPUT"
              echo "type=docker" >> "$GITHUB_OUTPUT"
              ;;
            "docker/lumier")
              echo "directory=libs/lumier" >> "$GITHUB_OUTPUT"
              echo "type=docker" >> "$GITHUB_OUTPUT"
              ;;
            "docker/qemu-android")
              echo "directory=libs/qemu-docker/android" >> "$GITHUB_OUTPUT"
              echo "type=docker" >> "$GITHUB_OUTPUT"
              ;;
            "docker/qemu-linux")
              echo "directory=libs/qemu-docker/linux" >> "$GITHUB_OUTPUT"
              echo "type=docker" >> "$GITHUB_OUTPUT"
              ;;
            "docker/qemu-windows")
              echo "directory=libs/qemu-docker/windows" >> "$GITHUB_OUTPUT"
              echo "type=docker" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown service: $SERVICE"
              exit 1
              ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          ref: ${{ needs.validate-request.outputs.commit }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v6.0.0
        with:
          python-version: "3.11"

      - name: Install bump2version
        run: >-
          python -m pip install --require-hashes --disable-pip-version-check
          --no-input -r .github/scripts/bump2version-requirements.txt

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Reconcile cua-driver-rs bump base with Cargo.toml (drift guard)
        if: ${{ needs.validate-request.outputs.service == 'cua-driver-rs' }}
        env:
          PACKAGE_DIRECTORY: ${{ steps.package.outputs.directory }}
        run: |
          # Cargo.toml is the single source of truth for the cua-driver-rs
          # version. bump2version keeps a duplicate current_version in
          # .bumpversion.cfg, and that copy has silently drifted before and cut
          # a release at the wrong version (binary reported a stale version,
          # tag could downgrade). Reconcile the cfg to Cargo.toml here, before
          # the dry-run tag-clean and the real bump both read it, so a bump can
          # never start from a stale base again no matter what the committed
          # cfg says.
          cd "$PACKAGE_DIRECTORY"
          CARGO_VERSION=$(grep -m1 '^version[[:space:]]*=' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          CFG_VERSION=$(grep -m1 '^current_version[[:space:]]*=' .bumpversion.cfg | sed -E 's/.*=[[:space:]]*//')
          if [ -z "$CARGO_VERSION" ]; then
            echo "::error::could not read version from libs/cua-driver/rust/Cargo.toml"
            exit 1
          fi
          if [ "$CARGO_VERSION" != "$CFG_VERSION" ]; then
            echo "::warning::.bumpversion.cfg current_version ($CFG_VERSION) drifted from Cargo.toml ($CARGO_VERSION); reconciling to Cargo.toml before bump."
            sed -i.bak -E "s/^current_version[[:space:]]*=.*/current_version = ${CARGO_VERSION}/" .bumpversion.cfg
            rm -f .bumpversion.cfg.bak
          fi
          echo "cua-driver-rs bump base: $(grep -m1 '^current_version' .bumpversion.cfg)"

      - name: Determine release version and tag
        id: release-version
        env:
          PACKAGE_DIRECTORY: ${{ steps.package.outputs.directory }}
          CONFIG_FILE: ${{ steps.package.outputs.bumpversion_config }}
        run: |
          set -euo pipefail
          cd "$PACKAGE_DIRECTORY"
          config_path="${CONFIG_FILE:-.bumpversion.cfg}"
          if [[ -n "$CONFIG_FILE" ]]; then
            config_args=(--config-file "$CONFIG_FILE")
          else
            config_args=()
          fi
          NEW_VERSION=$(bump2version --allow-dirty "${config_args[@]}" --dry-run --list "$BUMP_TYPE" \
            | awk -F= '$1 == "new_version" { print $2; exit }')
          [[ "$NEW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::bump2version returned an invalid version" >&2
            exit 1
          }
          TAG_TEMPLATE=$(sed -n 's/^[[:space:]]*tag_name[[:space:]]*=[[:space:]]*//p' "$config_path" | head -n 1)
          [[ "$TAG_TEMPLATE" == *'{new_version}'* ]] || {
            echo "::error::bumpversion config has no tag_name template" >&2
            exit 1
          }
          TAG_NAME=${TAG_TEMPLATE//\{new_version\}/$NEW_VERSION}
          git check-ref-format "refs/tags/$TAG_NAME"
          printf 'version=%s\n' "$NEW_VERSION" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG_NAME"

      - name: Reject an existing release tag
        env:
          TAG_NAME: ${{ steps.release-version.outputs.tag }}
        run: |
          set -euo pipefail
          set +e
          git ls-remote --exit-code origin "refs/tags/$TAG_NAME" >/dev/null 2>&1
          status=$?
          set -e
          case "$status" in
            0)
              echo "::error::release tag already exists: $TAG_NAME" >&2
              exit 1
              ;;
            2)
              echo "Release tag is unused: $TAG_NAME"
              ;;
            *)
              echo "::error::could not verify release tag availability (git status $status)" >&2
              exit "$status"
              ;;
          esac

      - name: Run bump2version
        env:
          PACKAGE_DIRECTORY: ${{ steps.package.outputs.directory }}
          CONFIG_FILE: ${{ steps.package.outputs.bumpversion_config }}
        run: |
          set -euo pipefail
          cd "$PACKAGE_DIRECTORY"
          if [[ -n "$CONFIG_FILE" ]]; then
            bump2version --allow-dirty --no-tag --config-file "$CONFIG_FILE" "$BUMP_TYPE"
          else
            bump2version --allow-dirty --no-tag "$BUMP_TYPE"
          fi

      - name: Sync Cargo.lock into the cua-driver-rs bump commit
        # bump2version edits only `[workspace.package] version` in Cargo.toml,
        # leaving Cargo.lock's workspace-member versions stale. The next plain
        # `cargo build` anyone runs then re-locks them and diverges from the
        # committed lockfile — which used to break the nix build's cargoHash.
        # Re-lock the members now and fold the change into the bump commit so the
        # lockfile never ships out of sync with the manifest. (cargo is
        # preinstalled on ubuntu runners; `--workspace` touches members only, not
        # registry deps, so this never silently bumps dependencies.)
        if: ${{ needs.validate-request.outputs.service == 'cua-driver-rs' }}
        env:
          PACKAGE_DIRECTORY: ${{ steps.package.outputs.directory }}
        run: |
          set -euo pipefail
          cd "$PACKAGE_DIRECTORY"
          cargo update --workspace
          if ! git diff --quiet Cargo.lock; then
            git add Cargo.lock
            git commit --amend --no-edit
            echo "Re-locked Cargo.lock in the bump commit."
          else
            echo "Cargo.lock already in sync; nothing to fold in."
          fi

      - name: Verify release commit and tag
        env:
          TAG_NAME: ${{ steps.release-version.outputs.tag }}
        run: |
          set -euo pipefail
          [[ -z "$(git tag --points-at HEAD)" ]] || {
            echo "::error::unexpected local tag on release commit" >&2
            exit 1
          }
          git diff --quiet
          git diff --cached --quiet
          echo "Prepared untagged release commit $(git rev-parse HEAD) for $TAG_NAME"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@0f859bf9e69e887678d5bbfbee594437cb440ffe # v2.1.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Push release to target branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_BRANCH: main
          TAG_NAME: ${{ steps.release-version.outputs.tag }}
          REPOSITORY: manaflow-ai/cmux-cua
        run: |
          set -euo pipefail
          # Keep the token out of the remote URL and local Git configuration.
          git remote set-url origin "https://github.com/${REPOSITORY}.git"
          # The helper must expand GH_TOKEN when Git invokes it, not now.
          # shellcheck disable=SC2016
          git config --local credential.helper \
            '!f() { printf "username=x-access-token\\npassword=%s\\n" "$GH_TOKEN"; }; f'
          trap 'git config --local --unset-all credential.helper >/dev/null 2>&1 || true' EXIT

          # Main is advanced with a compare-and-swap API update.  Each retry
          # uses a fresh branch, so no force push or mutable release ref is
          # needed while the commit object is uploaded.
          MAX_RETRIES=5
          for attempt in $(seq 1 "$MAX_RETRIES"); do
            echo "=== Attempt $attempt/$MAX_RETRIES ==="
            git fetch --no-tags origin "$TARGET_BRANCH"
            if ! git merge-base --is-ancestor "origin/$TARGET_BRANCH" HEAD; then
              echo "Rebasing the bump commit onto the latest $TARGET_BRANCH"
              git rebase "origin/$TARGET_BRANCH"
            fi

            COMMIT_SHA=$(git rev-parse HEAD)
            TAG_SLUG=${TAG_NAME//[^A-Za-z0-9._-]/-}
            TEMP_BRANCH="release-bump-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}-${TAG_SLUG:0:80}"
            git push origin "HEAD:refs/heads/$TEMP_BRANCH"

            if gh api --method PATCH "/repos/$REPOSITORY/git/refs/heads/$TARGET_BRANCH" \
              -f sha="$COMMIT_SHA" -F force=false; then
              echo "Updated $TARGET_BRANCH at $COMMIT_SHA"
              # Never replace an existing tag.  A failure here is terminal:
              # main moved, and retrying could produce a different release.
              if gh api --method POST "/repos/$REPOSITORY/git/refs" \
                -f ref="refs/tags/${TAG_NAME}" -f sha="$COMMIT_SHA"; then
                echo "Created immutable release tag $TAG_NAME"
                git push origin --delete "$TEMP_BRANCH" || \
                  echo "::warning::could not remove temporary branch $TEMP_BRANCH"
                exit 0
              fi
              echo "::error::tag creation failed after main advanced; refusing to rewrite $TAG_NAME" >&2
              git push origin --delete "$TEMP_BRANCH" || true
              exit 1
            fi

            git push origin --delete "$TEMP_BRANCH" || true
            if [[ "$attempt" -lt "$MAX_RETRIES" ]]; then
              echo "Main moved concurrently; retrying"
              sleep 2
            fi
          done

          echo "::error::failed to update $TARGET_BRANCH after $MAX_RETRIES attempts" >&2
          exit 1

  # Package consumers are triggered by the immutable tag created above.
