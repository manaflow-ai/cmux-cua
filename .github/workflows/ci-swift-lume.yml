name: "CI: Lume"
on:
  pull_request:
    paths:
      - "libs/lume/**"
      - ".github/workflows/ci-swift-lume.yml"

concurrency:
  group: lume-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runner images: https://docs.blacksmith.sh (GitHub-hosted labels are refused by scripts/ci/check-runner-labels.py)

jobs:
  test:
    name: Test
    runs-on: blacksmith-6vcpu-macos-15
    steps:
      - uses: actions/checkout@v4
      - run: uname -a
      # Prefer Xcode 16.3 (Swift 6.1) when the runner image has it. Blacksmith
      # macOS 15 images may ship only newer Xcode; then the default is used.
      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_16.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.3.app
          else
            echo "Xcode 16.3 not installed; using $(xcode-select -p)"
            ls -d /Applications/Xcode*.app || true
          fi
          swift --version
      - run: swift test
        working-directory: ./libs/lume
  build:
    name: Release build
    runs-on: blacksmith-6vcpu-macos-15
    steps:
      - uses: actions/checkout@v4
      - run: uname -a
      # Prefer Xcode 16.3 (Swift 6.1) when the runner image has it. Blacksmith
      # macOS 15 images may ship only newer Xcode; then the default is used.
      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_16.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.3.app
          else
            echo "Xcode 16.3 not installed; using $(xcode-select -p)"
            ls -d /Applications/Xcode*.app || true
          fi
          swift --version
      - run: swift build --configuration release
        working-directory: ./libs/lume
