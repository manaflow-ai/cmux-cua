name: "CI: Swift agent cursor"

# CmuxAgentCursor: the agent cursor package the cmux app and the cmux
# Computer Use helper share. Replays the glide vectors (the same file the
# Rust cursor-overlay test replays) and the automation.input vectors.
# The Linux job keeps the package building where QuartzCore is absent
# (GlidePlan+Animation.swift is macOS only).

on:
  pull_request:
    paths:
      - "libs/cmux-cua/swift/CmuxAgentCursor/**"
      - "libs/cmux-cua/rust/crates/cursor-overlay/**"
      - ".github/workflows/ci-swift-agent-cursor.yml"
  push:
    branches: [cmux-cua-native]
    paths:
      - "libs/cmux-cua/swift/CmuxAgentCursor/**"
      - "libs/cmux-cua/rust/crates/cursor-overlay/**"
      - ".github/workflows/ci-swift-agent-cursor.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-swift-agent-cursor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Swift agent cursor tests
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Show toolchain
        run: swift --version
      - name: Test
        run: swift test --package-path libs/cmux-cua/swift/CmuxAgentCursor

  test-linux:
    name: Swift agent cursor tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: public.ecr.aws/docker/library/swift:6.2-noble@sha256:d6f8f6112e9a63da0a4a151d6b93acd16699d35c0b82531ac1a245f5af210197
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Show toolchain
        run: swift --version
      - name: Test
        run: swift test --package-path libs/cmux-cua/swift/CmuxAgentCursor
