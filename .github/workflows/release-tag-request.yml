name: "Release tag request"

# This workflow is intentionally a credential-free observer. GitHub evaluates
# tag-triggered workflow files from the tag commit, so all privileged work runs
# in the protected-main workflow_run consumers instead.
on:
  push:
    tags:
      - "*-v*"

permissions: {}

concurrency:
  group: release-tag-request-${{ github.ref }}
  cancel-in-progress: false

jobs:
  request:
    name: Record protected release tag
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: Validate request metadata
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$REPOSITORY" = "trycua/cua"
          test "$REF_PROTECTED" = "true"
          [[ "$REF" =~ ^refs/tags/[A-Za-z0-9._/-]+-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "Requested protected release ${REF#refs/tags/} at $SHA"
