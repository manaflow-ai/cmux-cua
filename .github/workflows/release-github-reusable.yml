name: Reusable GitHub Release Workflow

# A release can be created only by a protected semantic-version tag. The
# caller supplies the expected prefix, while the verifier binds that tag to
# the exact commit and to the protected main branch before write permission is
# used.
on:
  workflow_call:
    inputs:
      tag_prefix:
        description: "Exact protected release tag prefix, for example agent-v"
        required: true
        type: string
      tag_name:
        description: "Git tag name, which must equal the triggering ref"
        required: true
        type: string
      source_sha:
        description: "Exact source commit returned by the protected release observer"
        required: true
        type: string
      source_tag:
        description: "Exact release tag returned by the protected release observer"
        required: true
        type: string
      release_name:
        description: "Release display name"
        required: true
        type: string
      module_path:
        description: "Path to the module for filtering commits"
        required: false
        type: string
        default: ""
      generate_notes:
        description: "Auto-generate release notes with attribution"
        required: false
        type: boolean
        default: true
      body:
        description: "Custom release notes content"
        required: false
        type: string
        default: ""
      attach_artifacts:
        description: "Whether to download and attach workflow artifacts"
        required: false
        type: boolean
        default: false
      draft:
        description: "Create as draft release"
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-${{ github.workflow }}-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: Verify protected release request
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      inputs.source_tag == inputs.tag_name
    permissions:
      contents: read
    uses: ./.github/workflows/validate-release-request.yml
    with:
      tag_prefix: ${{ inputs.tag_prefix }}
      expected_tag: ${{ inputs.source_tag }}
      expected_sha: ${{ inputs.source_sha }}

  create-release:
    name: Create GitHub release
    if: >-
      github.repository == 'trycua/cua' &&
      always() &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      inputs.source_tag == inputs.tag_name &&
      needs.verify-tag.result == 'success'
    needs: verify-tag
    runs-on: ubuntu-latest
    environment: github-release
    permissions:
      actions: read # Download release artifacts from this run.
      contents: write # Create the release and its tag metadata.
    steps:
      - name: Check out the verified tag commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the trusted release verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Release notes use the tag checkout, but provenance code must come
          # from protected main so an old tag cannot replace the write gate.
          repository: ${{ github.repository }}
          ref: main
          path: trusted-release
          fetch-depth: 1
          sparse-checkout: |
            .github/scripts/validate_release_request.py
            .github/scripts/validate_publisher_repository.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Recheck release provenance before write operations
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          TRUSTED_REF: ${{ github.ref }}
          TRUSTED_REF_TYPE: ${{ github.ref_type }}
          TRUSTED_REF_NAME: ${{ github.ref_name }}
          TRUSTED_REF_PROTECTED: ${{ github.ref_protected }}
          TRUSTED_SHA: ${{ github.workflow_sha || github.sha }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_STATUS: ${{ github.event.workflow_run.status }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
          SOURCE_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_TAG: ${{ inputs.source_tag }}
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: python3 trusted-release/.github/scripts/validate_release_request.py

      - name: Require canonical publisher repository
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 trusted-release/.github/scripts/validate_publisher_repository.py

      - name: Validate release input paths
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          RELEASE_NAME: ${{ inputs.release_name }}
          MODULE_PATH: ${{ inputs.module_path }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" != "$SOURCE_TAG" ]]; then
            echo "release tag input does not match the validated source tag" >&2
            exit 1
          fi
          if [[ -z "$RELEASE_NAME" || "$RELEASE_NAME" == *$'\n'* || "$RELEASE_NAME" == *$'\r'* ]]; then
            echo "release name is empty or contains a line break" >&2
            exit 1
          fi
          if [[ -n "$MODULE_PATH" ]]; then
            if [[ "$MODULE_PATH" == /* || "$MODULE_PATH" == *$'\n'* || "$MODULE_PATH" == *$'\r'* ]]; then
              echo "module path must be a relative repository path" >&2
              exit 1
            fi
            IFS=/ read -r -a module_parts <<< "$MODULE_PATH"
            for part in "${module_parts[@]}"; do
              if [[ -z "$part" || "$part" == . || "$part" == .. ]]; then
                echo "module path contains an unsafe component" >&2
                exit 1
              fi
            done
            [[ -d "$MODULE_PATH" ]] || {
              echo "module path does not exist: $MODULE_PATH" >&2
              exit 1
            }
          fi

      - name: Generate path-filtered release notes
        if: inputs.module_path != '' && inputs.generate_notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          MODULE_PATH: ${{ inputs.module_path }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/release-notes.md"
          : > "$notes_file"

          previous_tag=""
          while IFS= read -r candidate; do
            [[ "$candidate" == "$TAG_NAME" ]] && continue
            candidate_version="${candidate#"$TAG_PREFIX"}"
            [[ "$candidate" != "$candidate_version" ]] || continue
            [[ "$candidate_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || continue
            git merge-base --is-ancestor "$candidate" HEAD || continue
            previous_tag="$candidate"
            break
          done < <(git tag -l "${TAG_PREFIX}*" --sort=-v:refname)

          if [[ -n "$previous_tag" ]]; then
            commit_range="${previous_tag}..HEAD"
          else
            commit_range="HEAD"
          fi

          printf '%s\n\n' "## What's Changed" >> "$notes_file"
          found_commit=false
          while IFS=$'\t' read -r sha subject; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || continue
            [[ "$subject" =~ ^Bump[[:space:]]cua- ]] && continue

            username="$(gh api "repos/${REPOSITORY}/commits/${sha}" --jq '.author.login' 2>/dev/null || true)"
            if [[ ! "$username" =~ ^[A-Za-z0-9-]+$ ]]; then
              author_email="$(git show -s --format='%ae' "$sha")"
              if [[ "$author_email" =~ ^([0-9]+\+)?([A-Za-z0-9-]+)@users\.noreply\.github\.com$ ]]; then
                username="${BASH_REMATCH[2]}"
              else
                username="github-actions"
              fi
            fi

            linked_subject="$(printf '%s' "$subject" | sed -E "s~\\(#([0-9]+)\\)~([#\\1](https://github.com/${REPOSITORY}/pull/\\1))~g")"
            printf '* %s (%s) by @%s\n' "$linked_subject" "${sha:0:7}" "$username" >> "$notes_file"
            found_commit=true
          done < <(git log "$commit_range" --pretty=format:'%H%x09%s' -- "$MODULE_PATH" | sed -n '1,50p')

          if [[ "$found_commit" != true ]]; then
            printf '%s\n' 'Maintenance release: dependency updates only.' >> "$notes_file"
          fi

      - name: Prepare release artifact directory
        run: mkdir -p "$RUNNER_TEMP/release-assets"

      - name: Download release artifacts
        if: inputs.attach_artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - name: Reject symlink release artifacts
        if: inputs.attach_artifacts
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/release-assets
        run: |
          set -euo pipefail
          if find "$ARTIFACT_DIR" -type l -print -quit | grep -q .; then
            echo "release artifacts must not contain symlinks" >&2
            exit 1
          fi
          artifact_count=0
          while IFS= read -r -d '' _; do
            artifact_count=$((artifact_count + 1))
          done < <(find "$ARTIFACT_DIR" -type f -print0)
          if [[ "$artifact_count" -eq 0 ]]; then
            echo "attach_artifacts requested, but no regular files were downloaded" >&2
            exit 1
          fi
          if [[ "$artifact_count" -gt 64 ]]; then
            echo "release artifact count exceeds the safety limit" >&2
            exit 1
          fi

      - name: Prepare release body
        id: prepare-body
        env:
          CUSTOM_BODY: ${{ inputs.body }}
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/release-body.md"
          : > "$body_file"
          notes_file="$RUNNER_TEMP/release-notes.md"
          if [[ -s "$notes_file" ]]; then
            cat "$notes_file" >> "$body_file"
          fi
          if [[ -n "$CUSTOM_BODY" ]]; then
            if [[ -s "$body_file" ]]; then
              printf '\n%s\n' "$CUSTOM_BODY" >> "$body_file"
            else
              printf '%s\n' "$CUSTOM_BODY" >> "$body_file"
            fi
          fi
          printf 'path=%s\n' "$body_file" >> "$GITHUB_OUTPUT"

      - name: Create release with GitHub CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ inputs.tag_name }}
          RELEASE_NAME: ${{ inputs.release_name }}
          BODY_FILE: ${{ steps.prepare-body.outputs.path }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
          GENERATE_NOTES: ${{ inputs.module_path == '' && inputs.generate_notes }}
          ATTACH_ARTIFACTS: ${{ inputs.attach_artifacts }}
          ARTIFACT_DIR: ${{ runner.temp }}/release-assets
        run: |
          set -euo pipefail

          release_args=(
            release create "$TAG_NAME"
            --repo "$REPOSITORY"
            --verify-tag
            --title "$RELEASE_NAME"
            --notes-file "$BODY_FILE"
          )
          [[ "$DRAFT" == "true" ]] && release_args+=(--draft)
          [[ "$PRERELEASE" == "true" ]] && release_args+=(--prerelease)
          [[ "$GENERATE_NOTES" == "true" ]] && release_args+=(--generate-notes)

          if [[ "$ATTACH_ARTIFACTS" == "true" ]]; then
            while IFS= read -r -d '' artifact; do
              release_args+=("$artifact")
            done < <(find "$ARTIFACT_DIR" -type f -print0 | sort -z)
          fi

          gh "${release_args[@]}"
