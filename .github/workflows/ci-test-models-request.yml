name: "CI: Test Models (request)"

# This dispatcher is safe to run from any branch. It does not check out code,
# access model keys, or call third-party services. The privileged scheduled
# workflow accepts the request only when this run came from protected main.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: test-models-request-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  request:
    name: Request model test on main
    runs-on: ubuntu-24.04
    steps:
      - name: Require protected main
        env:
          REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" == "manaflow-ai/cmux-cua" ]] || {
            echo "Requests are accepted only in manaflow-ai/cmux-cua" >&2
            exit 1
          }
          [[ "$REF" == "refs/heads/main" ]] || {
            echo "Select the protected main branch before requesting model tests" >&2
            exit 1
          }
          [[ "$REF_PROTECTED" == "true" ]] || {
            echo "The selected main branch is not protected" >&2
            exit 1
          }
          [[ "$SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "The dispatch SHA is not a full commit" >&2
            exit 1
          }
